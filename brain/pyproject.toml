[project]
name = "minegpt-brain"
version = "0.1.0"
description = "MineGPT's brain: planner, skill library and training code that drives the Fabric mod."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minegpt_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
